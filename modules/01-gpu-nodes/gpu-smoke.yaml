apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke
  labels:
    app: gpu-smoke
spec:
  restartPolicy: Never
  # Required: the GPU NodePool taints its nodes.
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: nvidia-smi
      image: nvidia/cuda:12.8.1-base-ubuntu22.04
      command: ["nvidia-smi"]
      resources:
        # GPUs are extended resources: integers only, and requests must equal
        # limits. Setting only limits is the idiom (requests are copied).
        limits:
          nvidia.com/gpu: 1
